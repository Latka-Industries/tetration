[package]
name = "tetration-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tempfile = "3"
# No HDF5/NetCDF for the fuzz binary (native deps + slower builds).
tetration = { path = "..", default-features = false }

[[bin]]
name = "verify_tet_bytes"
path = "fuzz_targets/verify_tet_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_tet_bytes_deep"
path = "fuzz_targets/verify_tet_bytes_deep.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_tet_package"
path = "fuzz_targets/verify_tet_package.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_query_json"
path = "fuzz_targets/parse_query_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secondary_index_json"
path = "fuzz_targets/secondary_index_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secondary_index_seal"
path = "fuzz_targets/secondary_index_seal.rs"
test = false
doc = false
bench = false
