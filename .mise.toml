[tools]
rust = "1.95"
uv = "latest"

[tasks."fixtures:sync"]
description = "Install Python deps for fixture generation (uv sync)"
dir = "{{config_root}}/fixtures"
run = "uv sync"

[tasks."fixtures:small"]
description = "Generate tracked small HDF5/NetCDF/Zarr fixtures (baseline, groups, cf)"
depends = ["fixtures:sync"]
dir = "{{config_root}}/fixtures"
run = "uv run generate-fixtures small"

[tasks."fixtures:small-tet"]
description = "Regenerate tracked fixtures/small/tet/*.tet (verify/repair/query manual smoke)"
run = "cargo run --example gen_small_tet_fixtures"

[tasks.conformance]
description = "Run SPEC conformance pack (THI-592)"
run = "cargo test --lib conformance"

[tasks."fixtures:large"]
description = "Generate gitignored large suite (~20 GiB total: h5 + nc + zarr)"
depends = ["fixtures:sync"]
dir = "{{config_root}}/fixtures"
run = "uv run generate-fixtures large"

[tasks."fixtures:extra-large-h5"]
description = "Generate gitignored single 20 GiB HDF5 under fixtures/extra_large/h5/"
depends = ["fixtures:sync"]
dir = "{{config_root}}/fixtures"
run = "uv run generate-fixtures extra-large-h5"

[tasks."fixtures:extra-large-netcdf"]
description = "Generate gitignored single 20 GiB NetCDF under fixtures/extra_large/netcdf/"
depends = ["fixtures:sync"]
dir = "{{config_root}}/fixtures"
run = "uv run generate-fixtures extra-large-netcdf"

[tasks."fixtures:extra-large-zarr"]
description = "Generate gitignored single 20 GiB Zarr under fixtures/extra_large/zarr/"
depends = ["fixtures:sync"]
dir = "{{config_root}}/fixtures"
run = "uv run generate-fixtures extra-large-zarr"

[tasks."fixtures:large-h5"]
description = "Generate gitignored ~6.67 GiB HDF5 under fixtures/large/h5/"
depends = ["fixtures:sync"]
dir = "{{config_root}}/fixtures"
run = "uv run generate-fixtures large-h5"

[tasks."fixtures:large-netcdf"]
description = "Generate gitignored ~6.67 GiB NetCDF under fixtures/large/netcdf/"
depends = ["fixtures:sync"]
dir = "{{config_root}}/fixtures"
run = "uv run generate-fixtures large-netcdf"

[tasks."fixtures:large-zarr"]
description = "Generate gitignored ~6.67 GiB Zarr under fixtures/large/zarr/"
depends = ["fixtures:sync"]
dir = "{{config_root}}/fixtures"
run = "uv run generate-fixtures large-zarr"

[tasks."fixtures:all"]
description = "Generate small and large suite fixtures"
depends = ["fixtures:sync"]
dir = "{{config_root}}/fixtures"
run = "uv run generate-fixtures all"

[tasks."fixtures:clean-all"]
description = "Remove all generated files under fixtures/"
confirm = "Delete all files in fixtures/?"
run = "rm -rf fixtures/large fixtures/extra_large fixtures/small"

[tasks."fixtures:clean-large"]
description = "Remove generated files under fixtures/large/"
confirm = "Delete all files in fixtures/large/?"
run = "rm -rf fixtures/large"

[tasks."fixtures:clean-extra-large"]
description = "Remove generated files under fixtures/extra_large/"
confirm = "Delete all files in fixtures/extra_large/?"
run = "rm -rf fixtures/extra_large"

[tasks."bench:auto"]
description = "Large/extra_large bench — .tet queries with execution.device auto (all formats)"
depends = ["fixtures:sync"]
run = "cargo build --release && uv run --directory fixtures bench-large --tet-device auto"

[tasks."bench:cpu"]
description = "Large/extra_large bench — .tet queries forced to CPU (all formats)"
depends = ["fixtures:sync"]
run = "cargo build --release && uv run --directory fixtures bench-large --tet-device cpu"

[tasks."bench:gpu"]
description = "Large/extra_large bench — .tet queries on CUDA device 0 (all formats; needs --features tetration-gpu)"
depends = ["fixtures:sync"]
run = "cargo build --release --features tetration-gpu && uv run --directory fixtures bench-large --tet-device cuda"

[tasks."bench:metal"]
description = "Large/extra_large bench — .tet queries on Metal (macOS; --features tetration-metal)"
depends = ["fixtures:sync"]
run = "cargo build --release --features tetration-metal && uv run --directory fixtures bench-large --tet-device metal"

[tasks.bench]
description = "Alias for bench:auto (device routing auto)"
depends = ["bench:auto"]

[tasks."bench:h5"]
description = "Benchmark large + extra_large HDF5 only (device auto; use bench:cpu / bench:gpu for other modes)"
depends = ["fixtures:sync"]
run = "cargo build --release && uv run --directory fixtures bench-large h5 --tet-device auto"

[tasks."bench:netcdf"]
description = "Benchmark large + extra_large NetCDF only (device auto)"
depends = ["fixtures:sync"]
run = "cargo build --release && uv run --directory fixtures bench-large netcdf --tet-device auto"

[tasks."bench:zarr"]
description = "Benchmark large + extra_large Zarr only (device auto)"
depends = ["fixtures:sync"]
run = "cargo build --release && uv run --directory fixtures bench-large zarr --tet-device auto"

[tasks.clip-all]
description = "cargo clippy -D warnings (CI feature set for this OS)"
run = '''
FEAT="tetration-netcdf,tetration-hdf5,tetration-gpu"
case "$(uname -s)" in
  Darwin) FEAT="${FEAT},tetration-metal" ;;
esac
cargo clippy --features "$FEAT" -- -D warnings
'''

[tasks.fuzz-build]
description = "Build cargo-fuzz verify_tet_bytes target (THI-376; needs nightly)"
run = "cargo +nightly fuzz build verify_tet_bytes"

[tasks.fuzz]
description = "Run cargo-fuzz verify_tet_bytes quick scan (THI-376; needs nightly)"
run = "cargo +nightly fuzz run verify_tet_bytes"

[tasks.fuzz-smoke]
description = "CI-equivalent 60s fuzz smoke (THI-379; needs nightly)"
run = "cargo +nightly fuzz run verify_tet_bytes -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048"

[tasks.fuzz-deep]
description = "Run cargo-fuzz verify_tet_bytes_deep (THI-376; needs nightly)"
run = "cargo +nightly fuzz run verify_tet_bytes_deep"

[tasks.fuzz-package]
description = "Run cargo-fuzz verify_tet_package (THI-481; needs nightly)"
run = "cargo +nightly fuzz run verify_tet_package"

[tasks.fuzz-package-smoke]
description = "60s package fuzz smoke (THI-481; needs nightly)"
run = "cargo +nightly fuzz run verify_tet_package -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048"

[tasks.fuzz-clean]
description = "Remove mutated fuzz corpus + crash artifacts; keep *.tet / *.pkgfuzz seeds"
run = """
#!/usr/bin/env bash
set -euo pipefail
root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
cd "$root"
removed=0
if [[ -d fuzz/corpus ]]; then
  while IFS= read -r -d '' f; do
    rm -f "$f"
    removed=$((removed + 1))
  done < <(find fuzz/corpus -type f ! -name '*.tet' ! -name '*.pkgfuzz' -print0 2>/dev/null)
fi
rm -rf fuzz/artifacts
echo "fuzz-clean: removed $removed mutated corpus file(s); artifacts wiped; *.tet / *.pkgfuzz seeds kept"
"""

[tasks.fuzz-reseed]
description = "Refresh fuzz corpus *.tet / *.pkgfuzz seeds from fixtures (+ tiny reject stubs)"
run = """
#!/usr/bin/env bash
set -euo pipefail
root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
cd "$root"
mkdir -p fuzz/corpus/verify_tet_bytes fuzz/corpus/verify_tet_bytes_deep fuzz/corpus/verify_tet_package
cp fixtures/small/tet/sample.tet \\
   fixtures/small/tet/plan.tet \\
   fixtures/small/tet/multichunk_u8.tet \\
   fixtures/small/tet/multichunk_u32.tet \\
   fixtures/small/tet/multichunk_f16.tet \\
   fuzz/corpus/verify_tet_bytes/
cp fixtures/small/tet/sample.tet \\
   fixtures/small/tet/plan.tet \\
   fixtures/small/tet/multichunk_u8.tet \\
   fuzz/corpus/verify_tet_bytes_deep/
if [[ -d fixtures/small/tet/reject ]]; then
  cp fixtures/small/tet/reject/*.tet fuzz/corpus/verify_tet_bytes/ 2>/dev/null || true
  cp fixtures/small/tet/reject/*.tet fuzz/corpus/verify_tet_bytes_deep/ 2>/dev/null || true
fi
: > fuzz/corpus/verify_tet_bytes/empty.tet
printf 'TET\\x00' > fuzz/corpus/verify_tet_bytes/too_short.tet
printf 'XXXX\\x00\\x00\\x00\\x00' > fuzz/corpus/verify_tet_bytes/bad_magic.tet
cp fuzz/corpus/verify_tet_bytes/empty.tet \\
   fuzz/corpus/verify_tet_bytes/too_short.tet \\
   fuzz/corpus/verify_tet_bytes/bad_magic.tet \\
   fuzz/corpus/verify_tet_bytes_deep/

# --- package seeds (THI-481): length-prefixed PROTOCOL|CURRENT|MANIFEST|packed ---
enc=fuzz/scripts/encode_pkgfuzz.py
proto_ok='{"protocol_version":2}'
packed=fixtures/small/tet/sample.tet
packed_len=$(wc -c < "$packed" | tr -d ' ')
packed_sha=$(sha256sum "$packed" | awk '{print $1}')
manifest_ok=$(printf '{"generation":1,"protocol_version":2,"part_ids":["p0"],"packed_byte_len":%s,"packed_sha256":"%s"}' "$packed_len" "$packed_sha")

python3 "$enc" fuzz/corpus/verify_tet_package/healthy.pkgfuzz \\
  --protocol-text "$proto_ok" --current-text $'1\\n' --manifest-text "$manifest_ok" --packed "$packed"
python3 "$enc" fuzz/corpus/verify_tet_package/bad_protocol.pkgfuzz \\
  --protocol-text '{"protocol_version":99}' --current-text $'1\\n' --manifest-text "$manifest_ok" --packed "$packed"
python3 "$enc" fuzz/corpus/verify_tet_package/current_missing_gen.pkgfuzz \\
  --protocol-text "$proto_ok" --current-text $'9\\n' --manifest-text "$manifest_ok" --packed "$packed"
python3 "$enc" fuzz/corpus/verify_tet_package/missing_current.pkgfuzz \\
  --protocol-text "$proto_ok" --manifest-text "$manifest_ok" --packed "$packed"
python3 "$enc" fuzz/corpus/verify_tet_package/manifest_sha_mismatch.pkgfuzz \\
  --protocol-text "$proto_ok" --current-text $'1\\n' \\
  --manifest-text "$(printf '{"generation":1,"protocol_version":2,"part_ids":["p0"],"packed_byte_len":%s,"packed_sha256":"%s"}' "$packed_len" "$(printf '0%.0s' {1..64})")" \\
  --packed "$packed"
python3 "$enc" fuzz/corpus/verify_tet_package/manifest_len_mismatch.pkgfuzz \\
  --protocol-text "$proto_ok" --current-text $'1\\n' \\
  --manifest-text '{"generation":1,"protocol_version":2,"part_ids":["p0"],"packed_byte_len":1}' \\
  --packed "$packed"
python3 "$enc" fuzz/corpus/verify_tet_package/empty_proto.pkgfuzz --protocol-text ''
# Reject packed.tet inside an otherwise coherent package (layout-v1 fail path).
reject=fixtures/small/tet/reject/truncated_tidx.tet
reject_len=$(wc -c < "$reject" | tr -d ' ')
python3 "$enc" fuzz/corpus/verify_tet_package/reject_packed.pkgfuzz \\
  --protocol-text "$proto_ok" --current-text $'1\\n' \\
  --manifest-text "$(printf '{"generation":1,"protocol_version":2,"part_ids":["p0"],"packed_byte_len":%s}' "$reject_len")" \\
  --packed "$reject"

echo "fuzz-reseed: $(ls fuzz/corpus/verify_tet_bytes/*.tet | wc -l) quick; $(ls fuzz/corpus/verify_tet_bytes_deep/*.tet | wc -l) deep; $(ls fuzz/corpus/verify_tet_package/*.pkgfuzz | wc -l) package"
"""
