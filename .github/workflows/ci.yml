name: CI

# Prefer `paths` (allowlist) over `paths-ignore`: run only when Rust build inputs change.
# Include Cargo manifests + this workflow so lockfile/CI edits still get tested.
# Docs-only / LICENSE / .gitignore PRs skip the suite (required checks stay pending — merge
# with admin bypass or remove the required-check gate for docs PRs).
on:
  push:
    branches: [main, master]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/ci.yml"

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95
          components: rustfmt, clippy

      - name: Install system deps (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev libhdf5-dev pkg-config cmake

      - name: Install system deps (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install netcdf cmake

      - name: Install system deps (Windows)
        if: matrix.os == 'windows-latest'
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          activate-environment: ci
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict

      - name: Install and configure netcdf-rs build (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash -el {0}
        run: ./.github/scripts/configure-netcdf-env.sh

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Set Cargo features
        id: cargo_features
        shell: bash
        run: |
          # `tetration-metal` is macOS-only (see Cargo.toml). Do not use `--all-features` on Linux/Windows.
          # `tetration-gpu` and `tetration-rocm` are mutually exclusive — enable at most one driver backend.
          FEAT="tetration-netcdf,tetration-hdf5,tetration-gpu,tetration-parquet,tetration-s3"
          if [ "${{ runner.os }}" = "macOS" ]; then
            FEAT="${FEAT},tetration-metal"
          fi
          echo "value=${FEAT}" >> "${GITHUB_OUTPUT}"

      - name: Run clippy
        run: cargo clippy --features ${{ steps.cargo_features.outputs.value }} -- -D warnings

      - name: Start MinIO
        if: runner.os == 'Linux'
        run: ./.github/scripts/start-minio.sh

      - name: Run tests
        env:
          TETRATION_S3_ENDPOINT: ${{ runner.os == 'Linux' && 'http://127.0.0.1:9000' || '' }}
          TETRATION_S3_BUCKET: ${{ runner.os == 'Linux' && 'tetration-test' || '' }}
          TETRATION_S3_ACCESS_KEY: ${{ runner.os == 'Linux' && 'tetration' || '' }}
          TETRATION_S3_SECRET_KEY: ${{ runner.os == 'Linux' && 'tetration-secret' || '' }}
          TETRATION_S3_REQUIRED: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo test --features ${{ steps.cargo_features.outputs.value }} --verbose

      - name: FFI tests (Phase 11)
        run: cargo test --lib --features ${{ steps.cargo_features.outputs.value }},tetration-ffi ffi --verbose

      - name: Check FFI header sync
        shell: bash
        run: ./.github/scripts/check-ffi-header.sh

      - name: Build and run C FFI example
        if: runner.os != 'Windows'
        shell: bash
        run: ./.github/scripts/build-ffi-example.sh

      - name: SPEC Python smoke reader (THI-589)
        if: runner.os == 'Linux'
        run: python3 conformance/smoke/read_catalog_chunk.py fixtures/small/tet/sample.tet

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95

      - name: Install NetCDF (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev libhdf5-dev pkg-config cmake

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}

      - name: Check MSRV
        run: cargo check --all-targets --features tetration-s3
